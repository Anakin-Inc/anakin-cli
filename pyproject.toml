[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anakin-cli"
version = "0.3.0"
description = "CLI for Anakin.io: scrape, crawl, search, Wire actions, monitoring and AI visibility"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Anakin.io" }]
keywords = [
    "web-scraping",
    "search",
    "research",
    "data-extraction",
    "cli",
    "ai",
    "wire",
    "monitoring",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities",
]
dependencies = ["anakin-sdk>=0.2.0,<0.3", "rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21", "ruff>=0.5"]

[project.urls]
Homepage = "https://anakin.io"
Repository = "https://github.com/Anakin-Inc/anakin-cli"
Documentation = "https://anakin.io/docs/sdks/cli"

[project.scripts]
anakin = "anakin_cli.cli:main"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
